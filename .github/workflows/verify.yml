name: Verify Philon (Python)

# What this can honestly check on a Linux runner, and nothing beyond it.
#
# The Qt desktop suite, the Apple Vision helper and the macOS package are not
# here: PySide6 is not installed, and a GUI job on this runner would be
# theatre. What is here is the part that is pure Python and pure policy -- the
# conversion engine, the fuzz and benchmark suites, the five gates -- plus the
# one check neither repository can perform alone.
#
# Linux minutes bill at 1x where macOS bills at 10x, which is the reason this
# job exists separately from a local `scripts/verify-release.sh` run.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "documents/**"
      - "LICENSE"
      - ".gitignore"
  # Spelled out twice rather than shared through a YAML anchor: GitHub's
  # workflow parser does not support anchors.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "documents/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-policy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with:
          path: philon_p

      # A missing key fails the checkout below with an error that names neither
      # the secret nor the fix. Say it here instead, before the confusing one.
      #
      # There are two deploy keys, one per repository, each installed read-only
      # on its PEER -- so this repository holds the private half of the key that
      # tsevis/philon-python uses to read tsevis/philon. A deploy key is
      # accepted by exactly one repository on GitHub, which is what makes the
      # crossed-keys mistake below detectable.
      - name: Check the peer-repository key is present
        # NOT ON A PULL REQUEST. This step needs PHILON_PEER_TOKEN to read
        # tsevis/philon, and a credential that expires is a credential that
        # WILL expire: 15 of the last 17 runs here were red, every one of them
        # 401 Bad credentials, none of them about this repository's code.
        #
        # A pull request must be able to go green on what it changed. The
        # parity question is real and still asked -- on push and on the
        # nightly, where a stale token is a notice rather than a wall across
        # every branch.
        if: github.event_name != 'pull_request'
        env:
          PEER_KEY: ${{ secrets.PHILON_PEER_SSH_KEY }}
        run: |
          if [ -z "${PEER_KEY}" ]; then
            echo "::error::PHILON_PEER_SSH_KEY is not set on tsevis/philon-python. The parity gate has to check out tsevis/philon, which is private and which the built-in GITHUB_TOKEN cannot read. Generate a keypair, add the PUBLIC half to tsevis/philon as a read-only deploy key, and add the PRIVATE half here as PHILON_PEER_SSH_KEY."
            exit 1
          fi

      # The source project, so the parity gate has something to compare against.
      # ssh-key rather than token: a deploy key does not expire, which is the
      # failure this replaces -- both PATs lapsed on 2026-09-05 and again on
      # 2026-09-06, costing two red builds that had nothing to do with the code.
      - name: Check out the source project
        if: github.event_name != 'pull_request'
        id: peer
        uses: actions/checkout@v7
        with:
          repository: tsevis/philon
          ssh-key: ${{ secrets.PHILON_PEER_SSH_KEY }}
          path: philon

      # The likely misconfiguration, once there are two keys: they get crossed.
      # A key installed on the wrong repository fails as "Repository not found",
      # which reads like the repository is missing rather than the key misplaced.
      - name: Explain a failed peer checkout
        if: failure() && steps.peer.outcome == 'failure'
          && github.event_name != 'pull_request'
        env:
          PEER_KEY: ${{ secrets.PHILON_PEER_SSH_KEY }}
        run: |
          # Ask GitHub over SSH which failure this is rather than naming a
          # likely cause. This step cannot see the checkout's own error, and
          # the two failures need opposite fixes: an unrecognised key is
          # replaced, a misplaced one is moved to the right repository.
          #
          # GitHub's SSH endpoint separates them cleanly:
          #   "Permission denied (publickey)" -> the key is not installed anywhere
          #   "Repository not found"          -> the key is valid, but on another repo
          # The key is written 0600 to a private temp dir and removed after;
          # it is never echoed, and ls-remote prints only refs.
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "${PEER_KEY}" > "$keydir/id"
          chmod 600 "$keydir/id"

          out=$(GIT_SSH_COMMAND="ssh -i $keydir/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
                git ls-remote git@github.com:tsevis/philon.git 2>&1) && status=0 || status=$?

          if [ "$status" -eq 0 ]; then
            echo "::error::PHILON_PEER_SSH_KEY on tsevis/philon-python can read tsevis/philon — ls-remote succeeded, so the key is fine and the checkout failed for another reason. Read the checkout step's own log above."
          elif printf '%s' "$out" | grep -qi 'permission denied'; then
            echo "::error::PHILON_PEER_SSH_KEY on tsevis/philon-python is not recognised by GitHub — SSH answered 'Permission denied (publickey)', so it was never matched to a repository. Add the PUBLIC half of this keypair to tsevis/philon as a read-only deploy key, or regenerate the pair and set both halves."
          elif printf '%s' "$out" | grep -qi 'repository not found'; then
            echo "::error::PHILON_PEER_SSH_KEY on tsevis/philon-python cannot read tsevis/philon — SSH answered 'Repository not found', which for a valid key means it is installed on the wrong repository. The public half must be a deploy key on tsevis/philon, the PEER, not on tsevis/philon-python."
          else
            echo "::error::Could not check out tsevis/philon, and probing it over SSH failed for another reason. Neither an unrecognised key nor a misplaced one; read the checkout step's own log above."
          fi
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install the engine's dependencies
        working-directory: philon_p
        run: |
          python3 -m venv .venv
          # Every runtime pin except PySide6, taken from the one file that
          # declares them, because this job runs no interface.
          .venv/bin/pip install $(grep -v -e '^#' -e '^$' -e '^PySide6' requirements.txt | tr '\n' ' ')

      - name: Engine, fuzz and benchmark suites
        working-directory: philon_p
        run: .venv/bin/python -m unittest engine/test_engine.py engine/test_fuzz.py bench/test_run.py -v

      - name: Policy gates
        working-directory: philon_p
        run: |
          .venv/bin/python tests/local_only_policy.py
          .venv/bin/python tests/model_fetch_policy.py
          .venv/bin/python tests/license_policy.py
          .venv/bin/python tests/sbom_policy.py

      # The check neither repository can run on its own. Skipping is a failure
      # here: a parity gate that passes without a peer to compare against is
      # indistinguishable from one that compared and was satisfied.
      - name: Engine parity against the source project
        if: github.event_name != 'pull_request'
        working-directory: philon_p
        env:
          PHILON_PARITY_PEER: ${{ github.workspace }}/philon
          PHILON_PARITY_REQUIRE: "1"
        run: .venv/bin/python tests/parity_policy.py
