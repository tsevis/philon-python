name: Verify Philon (Python)

# What this can honestly check on a Linux runner, and nothing beyond it.
#
# The Qt desktop suite, the Apple Vision helper and the macOS package are not
# here: PySide6 is not installed, and a GUI job on this runner would be
# theatre. What is here is the part that is pure Python and pure policy -- the
# conversion engine, the fuzz and benchmark suites, the five gates -- plus the
# one check neither repository can perform alone.
#
# Linux minutes bill at 1x where macOS bills at 10x, which is the reason this
# job exists separately from a local `scripts/verify-release.sh` run.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "documents/**"
      - "LICENSE"
      - ".gitignore"
  # Spelled out twice rather than shared through a YAML anchor: GitHub's
  # workflow parser does not support anchors.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "documents/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-policy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with:
          path: philon_p

      # A missing or expired token fails the checkout below with an error that
      # names neither the secret nor the fix. Say it here instead, before the
      # confusing one happens.
      #
      # There are two tokens, one per repository, each scoped to read ONLY its
      # peer -- so this repository's token can read tsevis/philon and cannot read
      # tsevis/philon-python. Neither token needs to read the repository holding it.
      - name: Check the peer-repository token is present
        env:
          PEER_TOKEN: ${{ secrets.PHILON_PEER_TOKEN }}
        run: |
          if [ -z "${PEER_TOKEN}" ]; then
            echo "::error::PHILON_PEER_TOKEN is not set on tsevis/philon-python. The parity gate has to check out tsevis/philon, which is private and which the built-in GITHUB_TOKEN cannot read. Create a fine-grained PAT scoped to tsevis/philon only, with Contents: Read-only, and add it as PHILON_PEER_TOKEN here."
            exit 1
          fi

      # The source project, so the parity gate has something to compare against.
      - name: Check out the source project
        id: peer
        uses: actions/checkout@v7
        with:
          repository: tsevis/philon
          token: ${{ secrets.PHILON_PEER_TOKEN }}
          path: philon

      # The likely misconfiguration, once there are two tokens: they get crossed.
      # A token scoped to the wrong repository fails as "Repository not found",
      # which reads like the repository is missing rather than the scope wrong.
      - name: Explain a failed peer checkout
        if: failure() && steps.peer.outcome == 'failure'
        env:
          PEER_TOKEN: ${{ secrets.PHILON_PEER_TOKEN }}
        run: |
          # Ask the API which failure this is rather than naming a likely
          # cause. This step cannot see the checkout's own error, and the two
          # failures need opposite fixes: an expired token is replaced, a
          # mis-scoped one is re-scoped. Guessing cost real time on
          # 2026-09-05, when both tokens had expired and this message sent
          # the reader looking at scope.
          #
          # 401 is unambiguous. 404 is GitHub refusing to confirm a private
          # repository exists to a token that cannot read it, so it covers
          # both "wrong repository" and "no access to the right one".
          # Only the status code is printed; the token is never echoed.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Bearer ${PEER_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/tsevis/philon")
          case "$code" in
            401)
              echo "::error::PHILON_PEER_TOKEN on tsevis/philon-python is expired or revoked — the API answered 401 Bad credentials, so its scope was never even considered. Create a new fine-grained PAT scoped to tsevis/philon with Contents: Read-only, then: gh secret set PHILON_PEER_TOKEN --repo tsevis/philon-python"
              ;;
            404)
              echo "::error::PHILON_PEER_TOKEN on tsevis/philon-python cannot read tsevis/philon — the API answered 404, which for a private repository means the token is valid but scoped elsewhere. It must be scoped to tsevis/philon, the PEER, not to tsevis/philon-python."
              ;;
            200)
              echo "::error::PHILON_PEER_TOKEN on tsevis/philon-python can read tsevis/philon — the API answered 200, so the token is fine and the checkout failed for another reason. Read the checkout step's own log above."
              ;;
            *)
              echo "::error::Could not check out tsevis/philon, and probing the API for it returned $code. Neither an expired token (401) nor a scope problem (404); read the checkout step's own log above."
              ;;
          esac
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install the engine's dependencies
        working-directory: philon_p
        run: |
          python3 -m venv .venv
          # Every runtime pin except PySide6, taken from the one file that
          # declares them, because this job runs no interface.
          .venv/bin/pip install $(grep -v -e '^#' -e '^$' -e '^PySide6' requirements.txt | tr '\n' ' ')

      - name: Engine, fuzz and benchmark suites
        working-directory: philon_p
        run: .venv/bin/python -m unittest engine/test_engine.py engine/test_fuzz.py bench/test_run.py -v

      - name: Policy gates
        working-directory: philon_p
        run: |
          .venv/bin/python tests/local_only_policy.py
          .venv/bin/python tests/model_fetch_policy.py
          .venv/bin/python tests/license_policy.py
          .venv/bin/python tests/sbom_policy.py

      # The check neither repository can run on its own. Skipping is a failure
      # here: a parity gate that passes without a peer to compare against is
      # indistinguishable from one that compared and was satisfied.
      - name: Engine parity against the source project
        working-directory: philon_p
        env:
          PHILON_PARITY_PEER: ${{ github.workspace }}/philon
          PHILON_PARITY_REQUIRE: "1"
        run: .venv/bin/python tests/parity_policy.py
